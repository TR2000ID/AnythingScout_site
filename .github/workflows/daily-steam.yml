# Daily Steam update: today's Steam prices, sales and new games on the live Games section, with the PC off.
#
# Runs: every day at 19:17 UTC (04:17 in Japan, after Steam's sales switch over at 10:00 US Pacific time;
# 17 past, because GitHub delays runs set for the top of the hour), and whenever you press "Run workflow"
# on this repo's Actions tab (the online "Update now").
#
# What it does, on GitHub's computers (free: ~10 minutes a day of the ~2,000 free Linux minutes a month):
#   1. takes this repo at the `live` tag (the version you approved, never main) and Game Scout's code next to it
#   2. runs Game Scout's update_steam.py, which writes today's files into the live copy's Games data
#   3. builds the site and deploys it to Cloudflare (npm run deploy:golive), like tools/deploy_live.py on the PC
# If Steam has a bad day, update_steam.py stops without writing, the job stops before the deploy, yesterday's
# site stays up, and GitHub emails you about the failed run.
#
# Needs two secrets (Settings → Secrets and variables → Actions):
#   GAME_SCOUT_DEPLOY_KEY  private half of a read-only deploy key on TR2000ID/Game_Scout (Deploy keys)
#   CLOUDFLARE_API_TOKEN   Cloudflare API token, template "Edit Cloudflare Workers"
# To stop it: Actions tab → Daily Steam update → ⋯ → Disable workflow (or delete this file).
name: Daily Steam update

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A manual run while the daily one is going waits for it instead of deploying over it
concurrency:
  group: daily-steam
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: e92560e72e373929993087baeff73889  # not a secret: it only says which account

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: This repo at the live tag
        uses: actions/checkout@v5
        with:
          ref: live
          path: anything-scout

      - name: Game Scout's code (read-only deploy key)
        uses: actions/checkout@v5
        with:
          repository: TR2000ID/Game_Scout
          ssh-key: ${{ secrets.GAME_SCOUT_DEPLOY_KEY }}
          path: game-scout

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Steam prices, sales and new games
        working-directory: game-scout
        env:
          ANYTHING_SCOUT_DATA: ${{ github.workspace }}/anything-scout/web/public/data/games
          PYTHONUNBUFFERED: "1"
        run: |
          pip install numpy==2.5.3 requests==2.34.2
          python update_steam.py

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            anything-scout/web/package-lock.json
            anything-scout/worker/package-lock.json

      - name: Install
        run: |
          npm ci --prefix anything-scout/web
          npm ci --prefix anything-scout/worker

      - name: Build + deploy to Cloudflare
        working-directory: anything-scout/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:golive
