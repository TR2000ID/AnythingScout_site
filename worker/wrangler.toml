# Cloudflare Worker: Anime Scout's site + its one small server address, /api/watch (where to watch in Japan).
# The TMDB key is NOT here: locally it's in .dev.vars, online it's a Cloudflare secret (TMDB_KEY).
name = "anime-scout"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The site (built by `npm run build` in web/) is served from here, free. Anything that isn't a file,
# like /api/watch, goes to src/index.ts.
[assets]
directory = "../web/dist"
# Addresses like /anime/settings aren't files: answer them with index.html, and the site picks the page
# from the address (opening a link directly or reloading would otherwise give a 404)
not_found_handling = "single-page-application"
# /api/... always reaches src/index.ts first (never the site's index.html)
run_worker_first = ["/api/*"]

# D1 = Cloudflare's free SQLite database, for accounts. The tables are in migrations/.
# On the PC, `npm run dev` uses wrangler's own local copy (npm run db:local once), never the live one.
# The id below is a placeholder until go-live (Task 9 creates the real database and puts its id here).
[[d1_databases]]
binding = "DB"
database_name = "anything-scout"
database_id = "local-only-until-go-live"
migrations_dir = "migrations"
